name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  full-tests:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: |
            examples/go-ascii-art/go.sum
            integration-kits/go/go.sum

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            crates/cdk-spilman-python/pyproject.toml
            integration-kits/python/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            integration-kits/ts/package-lock.json
            examples/ts-ascii-art/package-lock.json

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Run full test suite
        run: make test-all

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-full-test-logs
          path: testing/*.log
          if-no-files-found: ignore
          retention-days: 14

  kit-tests:
    name: Integration kit tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: |
            examples/go-ascii-art/go.sum
            integration-kits/go/go.sum

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            crates/cdk-spilman-python/pyproject.toml
            integration-kits/python/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            integration-kits/ts/package-lock.json
            examples/ts-ascii-art/package-lock.json

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Run integration kit tests
        run: make test-kit-all

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-kit-test-logs
          path: testing/*.log
          if-no-files-found: ignore
          retention-days: 14
