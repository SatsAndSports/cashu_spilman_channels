name: Security

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-audit:
    name: Rust advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit

  go-vulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache-dependency-path: |
            examples/go-ascii-art/go.sum
            integration-kits/go/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Check Go integration kit
        run: govulncheck ./...
        working-directory: integration-kits/go

      - name: Check Go demo
        run: govulncheck ./...
        working-directory: examples/go-ascii-art

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            integration-kits/ts/package-lock.json
            examples/ts-ascii-art/package-lock.json

      - name: Audit TypeScript integration kit
        run: npm audit --audit-level=high
        working-directory: integration-kits/ts

      - name: Audit TypeScript demo
        run: npm audit --audit-level=high
        working-directory: examples/ts-ascii-art

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: examples/python-ascii-art/requirements.txt

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit Python demo requirements
        run: pip-audit -r examples/python-ascii-art/requirements.txt
