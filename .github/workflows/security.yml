name: Security

on:
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/go.mod'
      - '**/go.sum'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/pyproject.toml'
      - '**/requirements*.txt'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
      npm: ${{ steps.filter.outputs.npm }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust:
              - '**/Cargo.{toml,lock}'
              - '.github/workflows/security.yml'
            go:
              - '**/go.{mod,sum}'
              - '.github/workflows/security.yml'
            npm:
              - '**/package.json'
              - '**/package-lock.json'
              - '.github/workflows/security.yml'
            python:
              - '**/pyproject.toml'
              - '**/requirements*.txt'
              - '.github/workflows/security.yml'
  rust-audit:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    name: Rust advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit

  go-vulncheck:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true'
    name: Go vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            examples/go-ascii-art/go.sum
            integration-kits/go/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      # Module-level checks avoid compiling the Rust/cgo bridge. They report
      # vulnerable dependencies without claiming symbol-level reachability.
      # crates/cdk-spilman-go/go.mod is an empty module boundary with no Go
      # sources or dependencies; the actual binding module is in spilman/.
      - name: Check Go binding, kit, and demo modules
        run: |
          status=0
          for module in crates/cdk-spilman-go/spilman integration-kits/go examples/go-ascii-art; do
            (cd "$module" && govulncheck -scan=module) || status=1
          done
          exit "$status"

  npm-audit:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.npm == 'true'
    name: npm audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: TypeScript integration kit
            lockfile: integration-kits/ts/package-lock.json
            working-directory: integration-kits/ts
          - name: TypeScript demo
            lockfile: examples/ts-ascii-art/package-lock.json
            working-directory: examples/ts-ascii-art
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Audit ${{ matrix.name }}
        run: npm audit --audit-level=high
        working-directory: ${{ matrix.working-directory }}

  python-audit:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.python == 'true'
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: examples/python-ascii-art/requirements.txt

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Collect Python requirements without building local bindings
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          requirements = [pathlib.Path("examples/python-ascii-art/requirements.txt").read_text()]
          for filename in ("crates/cdk-spilman-python/pyproject.toml", "integration-kits/python/pyproject.toml"):
              data = tomllib.loads(pathlib.Path(filename).read_text())
              requirements.extend(data.get("build-system", {}).get("requires", []))
              project = data.get("project", {})
              requirements.extend(project.get("dependencies", []))
              for extra in project.get("optional-dependencies", {}).values():
                  requirements.extend(extra)
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "audit-requirements.txt"
          target.write_text("\n".join(requirements) + "\n")
          PY
      - name: Audit Python binding, kit, extras, and demo dependencies
        run: pip-audit -r "$RUNNER_TEMP/audit-requirements.txt"
