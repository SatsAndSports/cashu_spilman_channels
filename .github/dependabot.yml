version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 90
    open-pull-requests-limit: 3
    groups:
      compatible-rust:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directories:
      - /integration-kits/ts
      - /examples/ts-ascii-art
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 90
    open-pull-requests-limit: 2
    groups:
      compatible-npm:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: pip
    directories:
      - /crates/cdk-spilman-python
      - /integration-kits/python
      - /examples/python-ascii-art
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 90
    open-pull-requests-limit: 2
    groups:
      compatible-python:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directories:
      - /crates/cdk-spilman-go
      - /crates/cdk-spilman-go/spilman
      - /integration-kits/go
      - /examples/go-ascii-art
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 90
    open-pull-requests-limit: 2
    groups:
      compatible-go:
        patterns: ['*']
        update-types: [minor, patch]
