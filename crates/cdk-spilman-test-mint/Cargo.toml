[package]
name = "cdk-spilman-test-mint"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Minimal standalone test mint for Spilman flows"
publish = false

[[bin]]
name = "cdk-spilman-test-mintd"
path = "src/main.rs"
required-features = ["http"]

[features]
default = ["http"]
http = ["dep:cdk-axum", "dep:axum"]

[dependencies]
anyhow.workspace = true
axum = { workspace = true, optional = true }
bip39.workspace = true
cdk.workspace = true
cdk-axum = { workspace = true, optional = true }
cdk-common.workspace = true
cdk-fake-wallet.workspace = true
cdk-spilman = { path = "../cdk-spilman" }
cdk-sqlite.workspace = true
cashu.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
bitcoin.workspace = true
reqwest.workspace = true
serde.workspace = true
tempfile = "3"
futures-util = "0.3"
tokio-tungstenite = "0.26"

[lints]
workspace = true
